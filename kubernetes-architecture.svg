<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- Cluster outer boundary -->
  <rect x="20" y="20" width="960" height="580" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0f172a">☸️ Kubernetes Cluster</text>

  <!-- Control Plane box -->
  <rect x="50" y="80" width="420" height="480" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="70" y="112" font-size="18" font-weight="700" fill="#3730a3">🧠 Control Plane</text>
  <text x="70" y="132" font-size="12" fill="#4338ca">Manages the cluster</text>

  <!-- API Server -->
  <rect x="75" y="150" width="370" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="95" y="175" font-size="15" font-weight="600" fill="#1e1b4b">🚪 kube-apiserver</text>
  <text x="95" y="195" font-size="12" fill="#475569">Front door — handles all API requests</text>

  <!-- etcd -->
  <rect x="75" y="222" width="370" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="95" y="247" font-size="15" font-weight="600" fill="#1e1b4b">💾 etcd</text>
  <text x="95" y="267" font-size="12" fill="#475569">Stores cluster state — source of truth</text>

  <!-- Scheduler -->
  <rect x="75" y="294" width="370" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="95" y="319" font-size="15" font-weight="600" fill="#1e1b4b">📍 kube-scheduler</text>
  <text x="95" y="339" font-size="12" fill="#475569">Decides which Node runs a Pod</text>

  <!-- Controller Manager -->
  <rect x="75" y="366" width="370" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="95" y="391" font-size="15" font-weight="600" fill="#1e1b4b">🔄 kube-controller-manager</text>
  <text x="95" y="411" font-size="12" fill="#475569">Keeps actual state = desired state</text>

  <!-- Cloud Controller Manager -->
  <rect x="75" y="438" width="370" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="95" y="463" font-size="15" font-weight="600" fill="#1e1b4b">☁️ cloud-controller-manager</text>
  <text x="95" y="483" font-size="12" fill="#475569">Integrates with Azure / cloud provider</text>

  <!-- Control plane note -->
  <text x="95" y="530" font-size="12" fill="#4338ca" font-style="italic">Think: Control Plane = the brain of Kubernetes</text>

  <!-- Worker Nodes box -->
  <rect x="510" y="80" width="440" height="480" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="530" y="112" font-size="18" font-weight="700" fill="#065f46">🖥️ Worker Nodes</text>
  <text x="530" y="132" font-size="12" fill="#047857">Run application workloads</text>

  <!-- kubelet -->
  <rect x="535" y="150" width="390" height="60" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="175" font-size="15" font-weight="600" fill="#064e3b">🔧 kubelet</text>
  <text x="555" y="195" font-size="12" fill="#475569">Node agent — manages assigned Pods</text>

  <!-- Container Runtime -->
  <rect x="535" y="222" width="390" height="60" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="247" font-size="15" font-weight="600" fill="#064e3b">📦 Container Runtime</text>
  <text x="555" y="267" font-size="12" fill="#475569">containerd — runs the containers</text>

  <!-- Networking -->
  <rect x="535" y="294" width="390" height="60" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="319" font-size="15" font-weight="600" fill="#064e3b">🌐 Networking</text>
  <text x="555" y="339" font-size="12" fill="#475569">Pod-to-Pod and Service communication</text>

  <!-- Pods -->
  <rect x="535" y="366" width="390" height="132" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="391" font-size="15" font-weight="600" fill="#064e3b">📦 Pods</text>
  <text x="555" y="411" font-size="12" fill="#475569">Smallest deployable unit</text>

  <rect x="555" y="424" width="100" height="55" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="605" y="456" font-size="12" text-anchor="middle" fill="#065f46">Pod</text>

  <rect x="670" y="424" width="100" height="55" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="720" y="456" font-size="12" text-anchor="middle" fill="#065f46">Pod</text>

  <rect x="785" y="424" width="100" height="55" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="835" y="456" font-size="12" text-anchor="middle" fill="#065f46">Pod</text>

  <!-- Worker node note -->
  <text x="555" y="530" font-size="12" fill="#047857" font-style="italic">Think: Worker Nodes = where applications actually run</text>

  <!-- Connector arrow between Control Plane and Worker Nodes -->
  <line x1="445" y1="230" x2="535" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="220" font-size="11" fill="#475569">manages</text>

  <line x1="535" y1="180" x2="445" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="172" font-size="11" fill="#475569">reports status</text>

  <!-- Footer -->
  <text x="500" y="585" text-anchor="middle" font-size="12" fill="#64748b">Desired State (Control Plane) → Actual State (Worker Nodes) → Continuous Reconciliation</text>
</svg>
